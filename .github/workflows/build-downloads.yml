name: Build downloads

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows executable
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt
          pyinstaller --onefile --windowed --name ULTRA desktop/ultra_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-windows
          path: dist/ULTRA.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android APK
        working-directory: ultra-android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-android
          path: ultra-android/app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ultra-windows/ULTRA.exe
            release/ultra-android/app-debug.apk
